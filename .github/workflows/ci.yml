# A planted run of the bridge check (docs/design/repository-checks.md section 9): only the
# runtime job, up to its cache keys, whose step must fail on the planted change to wine_bridge.h.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # No build or test run sends telemetry: the .NET CLI, Microsoft.Testing.Platform and
  # Avalonia's build statistics each read one of these.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# In every job, each step after the setup runs even when an earlier one failed, so that one
# run shows every failure.
jobs:
  runtime:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # eng/toolchain.json pins this image as macos-runner-image, and tools/CheckToolchain.cs
    # fails when the two differ.
    runs-on: xcode-27
    # About twice the slowest steps seen so far, which build Wine from scratch (D14).
    timeout-minutes: 90
    # A newer run of the same pull request waits for this one instead of cancelling it, so that
    # a cold build of Wine is never thrown away halfway through (D14). Each push to main has a
    # group of its own, because GitHub keeps one pending run per group and cancels it when a
    # newer one queues, which would leave a commit of main without a runtime run.
    concurrency:
      group: runtime-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Select the Xcode that eng/toolchain.json pins (eng/mac/select-xcode.sh)
        run: eng/mac/select-xcode.sh

      # The keys of C-0011 section 4. The build tools: their pins in eng/toolchain.json and the
      # bootstrap. A fork's build: the fork's commit; the pins of the macOS image and of the
      # tools that build the forks; the fork's build script; the bootstrap; and select-xcode.sh.
      # A pin that no fork build uses, such as gitleaks', is in no key, so that moving it
      # rebuilds nothing. A key names its fork's commit in full; the rest is a SHA-256 prefix.
      # The build steps only fetch a fork and call its script, with no option or environment of
      # their own: every option that shapes a build lives in the keyed scripts. Wine's build
      # also includes src/native/include/paneport/wine_bridge.h, which its key follows through
      # the header's SHA-256 in build-wine.sh. The script checks it only when it builds, so it is
      # checked here on every run, before any restore: a stale value would keep the key, and the
      # job would restore a Wine built against the old header.
      - name: Compute the cache keys
        id: keys
        run: |
          set -o pipefail
          bridge=$(shasum -a 256 src/native/include/paneport/wine_bridge.h | cut -d ' ' -f 1)
          if ! grep -qxF "bridge_sha256=$bridge" eng/mac/build-wine.sh; then
            echo "::error title=Cache keys::src/native/include/paneport/wine_bridge.h has" \
              "changed: update bridge_sha256 in eng/mac/build-wine.sh to its SHA-256, $bridge," \
              "so that Wine's cache key follows it." >&2
            exit 1
          fi
          pins() {
            for tool in "$@"; do
              printf '%s ' "$tool"
              if ! plutil -extract "tools.$tool" json -o - eng/toolchain.json; then
                echo "::error title=Cache keys::eng/toolchain.json has no pin for $tool." >&2
                exit 1
              fi
              echo
            done
          }
          digest() { shasum -a 256 | cut -c1-16; }
          tools=$({ pins cmake python llvm-mingw meson ninja bison; cat eng/mac/bootstrap.sh; } | digest)
          forks=$({ pins macos-runner-image xcode llvm-mingw cmake ninja python bison flex
            cat eng/mac/bootstrap.sh eng/mac/select-xcode.sh; } | digest)
          wine=$({ echo "$forks"; cat eng/mac/build-wine.sh; } | digest)
          fex=$({ echo "$forks"; cat eng/mac/build-fex.sh; } | digest)
          {
            echo "tools=runtime-tools-$tools"
            echo "wine=runtime-wine-$(git rev-parse HEAD:external/Paneport-wine)-$wine"
            echo "fex=runtime-fex-$(git rev-parse HEAD:external/Paneport-FEX)-$fex"
          } | tee -a "$GITHUB_OUTPUT"
