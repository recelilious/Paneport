# The jobs of C-0011 section 4 that exist so far. README.md in this folder explains them.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # No build or test run sends telemetry: the .NET CLI, Microsoft.Testing.Platform and
  # Avalonia's build statistics each read one of these.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore from the lock files
        run: dotnet restore eng/ci.slnf --locked-mode

      - name: Build
        run: dotnet build eng/ci.slnf -c Release --no-restore

      - name: Test
        run: dotnet test eng/ci.slnf -c Release --no-build --fail-skips on

      - name: Check formatting
        run: dotnet format eng/ci.slnf --verify-no-changes --no-restore

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the REUSE tool that eng/toolchain.json pins
        run: pipx install "reuse==$(jq -r '.tools.reuse.version' eng/toolchain.json)"

      - name: Check license headers and texts
        run: reuse lint
