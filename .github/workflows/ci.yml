# The jobs of C-0011 section 4 that exist so far. README.md in this folder lists them, and
# docs/design/repository-checks.md describes every check.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # No build or test run sends telemetry: the .NET CLI, Microsoft.Testing.Platform and
  # Avalonia's build statistics each read one of these.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# In every job, each step after the setup runs even when an earlier one failed, so that one
# run shows every failure.
jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # NuGet's packages come from a cache that only main saves (plan decision D14). Saved for
      # every branch and pull request, as setup-dotnet's own cache did, they filled the
      # repository's 10 GB of caches. Elsewhere any entry of main for the same system is a fine
      # start, because the locked restore fetches what it lacks. main itself takes only the exact
      # key, so that an entry it saves never carries the packages of older lock files.
      - name: Restore NuGet's packages from the cache of main
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ github.ref != 'refs/heads/main' && format('nuget-{0}-', runner.os) || '' }}

      - name: Check the SDK against global.json
        run: dotnet run tools/CheckToolchain.cs

      - name: Restore from the lock files
        if: ${{ !cancelled() }}
        run: dotnet restore eng/ci.slnf --locked-mode

      # Locked mode writes a missing lock file instead of failing, so a lock file that the
      # restore or a tool's run created or changed fails here: every project commits its own.
      - name: Check that no lock file was written
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          written=$(git status --porcelain --untracked-files=all -- '*.lock.json')
          if [ -n "$written" ]; then
            echo "$written"
            echo "::error title=Lock files::A lock file was created or changed. Commit each project's lock file (C-0009 section 2)."
            exit 1
          fi

      - name: Build
        if: ${{ !cancelled() }}
        run: dotnet build eng/ci.slnf -c Release --no-restore

      - name: Test
        if: ${{ !cancelled() }}
        run: dotnet test eng/ci.slnf -c Release --no-build --fail-skips on

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: dotnet format eng/ci.slnf --verify-no-changes --no-restore

      - name: Check the formatting of the tools
        if: ${{ !cancelled() }}
        run: dotnet format whitespace tools --folder --verify-no-changes

      - name: Publish the trimmed test app, with every trimming warning shown
        if: ${{ !cancelled() }}
        run: dotnet publish tests/Paneport.TrimTest/Paneport.TrimTest.csproj -c Release --no-build

      - name: Save NuGet's packages to the cache, on main only
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out, with the whole history for gitleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # REUSE comes from PyPI. gitleaks and lychee come from their GitHub releases, and each
      # download must match the SHA-256 that eng/toolchain.json pins before it is unpacked.
      - name: Install the CI tools that eng/toolchain.json pins
        shell: bash
        run: |
          pipx install "reuse==$(jq -r '.tools.reuse.version' eng/toolchain.json)"
          mkdir -p "$RUNNER_TEMP/bin"
          for tool in $(jq -r '.tools | to_entries[] | select(.value.downloads["linux-x64"]) | .key' eng/toolchain.json); do
            url=$(jq -r --arg tool "$tool" '.tools[$tool].downloads["linux-x64"].url' eng/toolchain.json)
            sha256=$(jq -r --arg tool "$tool" '.tools[$tool].downloads["linux-x64"].sha256' eng/toolchain.json)
            archive="$RUNNER_TEMP/$tool.tar.gz"
            curl --fail --silent --show-error --location --retry 3 --output "$archive" "$url"
            echo "$sha256  $archive" | sha256sum --check --strict
            mkdir -p "$RUNNER_TEMP/$tool"
            tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/$tool"
            binary=$(find "$RUNNER_TEMP/$tool" -type f -name "$tool" | head -n 1)
            install -m 755 "$binary" "$RUNNER_TEMP/bin/$tool"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Self-test the toolchain check
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckToolchain.cs -- --self-test

      - name: Check the SDK and the CI tools against their pins
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckToolchain.cs -- --ci-tools

      - name: Self-test the personal-data and forbidden-file check
        if: ${{ !cancelled() }}
        run: dotnet run tools/ScanPersonalData.cs -- --self-test

      - name: Self-test the dependency license check
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckLicenses.cs -- --self-test

      - name: Self-test the package scan
        if: ${{ !cancelled() }}
        run: dotnet run tools/ScanPackage.cs -- --self-test

      # M9.1: the tools of the release workflow, which runs only for tags, check themselves on every
      # run; the ios job runs them on macOS too.
      - name: Self-test the version rules (tools/ReleaseVersion.cs)
        if: ${{ !cancelled() }}
        run: dotnet run tools/ReleaseVersion.cs -- --self-test

      - name: Self-test the source archiver (tools/ArchiveSources.cs)
        if: ${{ !cancelled() }}
        run: dotnet run tools/ArchiveSources.cs -- --self-test

      # Its fixtures break one rule each, and each must fail naming that rule (M3.1).
      - name: Self-test the compatibility check
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckCompat.cs -- --self-test

      - name: Check license headers and texts (REUSE)
        if: ${{ !cancelled() }}
        run: reuse lint

      # The findings are redacted, and only their file, line, rule and commit are printed:
      # gitleaks' own verbose output would also print each commit's author and e-mail address.
      # gitleaks skips the findings that a .gitleaksignore in the scanned folder lists, whatever
      # its options, so such a file fails the step: every exception lives in eng/gitleaks.toml.
      - name: Scan the whole history for secrets (gitleaks)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -e .gitleaksignore ]; then
            echo "::error file=.gitleaksignore,title=gitleaks::gitleaks would skip the findings this file lists. Exceptions belong in eng/gitleaks.toml."
            exit 1
          fi
          report="$RUNNER_TEMP/gitleaks.json"
          status=0
          gitleaks git --config eng/gitleaks.toml --redact --ignore-gitleaks-allow --no-banner \
            --report-format json --report-path "$report" . || status=$?
          if [ -f "$report" ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks::\(.RuleID), commit \(.Commit[0:12])",
              "\(.File):\(.StartLine): \(.RuleID): \(.Description) (commit \(.Commit[0:12]))"' "$report"
          fi
          exit "$status"

      - name: Check for personal data and forbidden files
        if: ${{ !cancelled() }}
        run: dotnet run tools/ScanPersonalData.cs

      # lychee 0.24.2 retries a timeout, a lost connection or a 429, but not a server error
      # (5xx), and github.com answers some of its requests with 503 for a while. Its cache,
      # .lycheecache, keeps the links that passed and never a failure, so after a run in which
      # links failed (exit code 2), the step checks the failed links again, after 30 and then
      # 60 seconds. A link fails the step only if it failed every run. lychee sends the token only
      # to the GitHub API (docs/design/repository-checks.md section 6).
      - name: Check links in Markdown, outside the research notes (lychee)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          lychee --config eng/lychee.toml --no-progress --cache . || status=$?
          for pause in 30 60; do
            [ "$status" -eq 2 ] || break
            echo "::notice title=lychee::Links failed. lychee checks them again in $pause seconds."
            sleep "$pause"
            status=0
            lychee --config eng/lychee.toml --no-progress --cache . || status=$?
          done
          rm -f .lycheecache
          exit "$status"

      # The research notes' external sources are not checked (eng/lychee.toml says why).
      - name: Check the relative links of the research notes (lychee, offline)
        if: ${{ !cancelled() }}
        run: lychee --offline --no-progress --extensions md docs/research

      # compat/ios-builds.json against its schema (C-0006 section 6); the title files join with
      # M8.3.
      - name: Check the compatibility data
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckCompat.cs

      - name: Check dependency licenses
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckLicenses.cs

  # The runtime tests (C-0011 sections 1 and 4): our own Win32 test programs of tests/win32,
  # run under the Wine and FEX forks on the macOS harness (docs/design/runtime-macos-harness.md).
  # Plan decision D14: it runs for every pull request and every push to main, and a merge
  # waits for it; a push to another branch skips it, because the pull request's run covers it.
  runtime:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # eng/toolchain.json pins this image as macos-runner-image, and tools/CheckToolchain.cs
    # fails when the two differ.
    runs-on: xcode-27
    # About twice the slowest steps seen so far, which build Wine from scratch (D14).
    timeout-minutes: 90
    # A newer run of the same pull request waits for this one instead of cancelling it, so that
    # a cold build of Wine is never thrown away halfway through (D14). Each push to main has a
    # group of its own, because GitHub keeps one pending run per group and cancels it when a
    # newer one queues, which would leave a commit of main without a runtime run.
    concurrency:
      group: runtime-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Select the Xcode that eng/toolchain.json pins (eng/mac/select-xcode.sh)
        run: eng/mac/select-xcode.sh

      # The keys of C-0011 section 4. The build tools: their pins in eng/toolchain.json and the
      # bootstrap. A fork's build: the fork's commit; the pins of the macOS image and of the
      # tools that build the forks; the fork's build script; the bootstrap; and select-xcode.sh.
      # A pin that no fork build uses, such as gitleaks', is in no key, so that moving it
      # rebuilds nothing. A key names its fork's commit in full; the rest is a SHA-256 prefix.
      # The build steps only fetch a fork and call its script, with no option or environment of
      # their own: every option that shapes a build lives in the keyed scripts.
      - name: Compute the cache keys
        id: keys
        run: |
          set -o pipefail
          pins() {
            for tool in "$@"; do
              printf '%s ' "$tool"
              if ! plutil -extract "tools.$tool" json -o - eng/toolchain.json; then
                echo "::error title=Cache keys::eng/toolchain.json has no pin for $tool." >&2
                exit 1
              fi
              echo
            done
          }
          digest() { shasum -a 256 | cut -c1-16; }
          tools=$({ pins cmake python llvm-mingw meson ninja bison; cat eng/mac/bootstrap.sh; } | digest)
          forks=$({ pins macos-runner-image xcode llvm-mingw cmake ninja python bison flex
            cat eng/mac/bootstrap.sh eng/mac/select-xcode.sh; } | digest)
          wine=$({ echo "$forks"; cat eng/mac/build-wine.sh; } | digest)
          fex=$({ echo "$forks"; cat eng/mac/build-fex.sh; } | digest)
          {
            echo "tools=runtime-tools-$tools"
            echo "wine=runtime-wine-$(git rev-parse HEAD:external/Paneport-wine)-$wine"
            echo "fex=runtime-fex-$(git rev-parse HEAD:external/Paneport-FEX)-$fex"
          } | tee -a "$GITHUB_OUTPUT"

      # Only an exact key restores anything, so that a stale build is never used.
      - name: Restore the build tools of the forks from the cache
        id: tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/paneport-tools
          key: ${{ steps.keys.outputs.tools }}

      # It checks the SDK and Xcode against their pins, installs what the cache did not bring of
      # CMake, Python, llvm-mingw, Meson, Ninja and GNU Bison, and checks them against their
      # pins. llvm-mingw stays off the PATH, in LLVM_MINGW.
      - name: Check the toolchain and install the fork tools (eng/mac/bootstrap.sh --forks)
        id: tools
        run: eng/mac/bootstrap.sh --forks

      - name: Save the build tools of the forks to the cache
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.tools-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/paneport-tools
          key: ${{ steps.keys.outputs.tools }}

      - name: Restore Wine's build from the cache
        id: wine-cache
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/wine/install
          key: ${{ steps.keys.outputs.wine }}

      # Only when the cache does not have it: the Wine fork at the commit that this repository
      # records, fetched at depth 1, then built, installed and checked by the script.
      - name: Build Wine (eng/mac/build-wine.sh)
        id: wine
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.wine-cache.outputs.cache-hit != 'true' }}
        run: |
          git submodule update --init --depth 1 external/Paneport-wine
          eng/mac/build-wine.sh
          du -sh build/wine/install

      # Right after the build, so that a failing harness, a timeout or a cancelled run keeps it.
      - name: Save Wine's build to the cache
        if: ${{ always() && steps.wine.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/wine/install
          key: ${{ steps.keys.outputs.wine }}

      - name: Restore FEX's module from the cache
        id: fex-cache
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fex/install
          key: ${{ steps.keys.outputs.fex }}

      # The script fetches the submodules of FEX that the build needs.
      - name: Build FEX's ARM64EC module (eng/mac/build-fex.sh)
        id: fex
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.fex-cache.outputs.cache-hit != 'true' }}
        run: |
          git submodule update --init --depth 1 external/Paneport-FEX
          eng/mac/build-fex.sh

      - name: Save FEX's module to the cache
        if: ${{ always() && steps.fex.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fex/install
          key: ${{ steps.keys.outputs.fex }}

      # S4.2.4: the Win32 test programs, which the device test flavor bundles from M4.4 on. They
      # build with the pinned llvm-mingw, with every compiler warning an error and every link
      # warning an error but the expected one that eng/mac/build-win32-tests.sh names.
      - name: Build the Win32 test programs (eng/mac/build-win32-tests.sh)
        id: win32
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: eng/mac/build-win32-tests.sh x86_64

      # clang-tidy analyzes the programs with the compile database of the build, in a step of
      # its own, so that a finding does not keep the cases from running. llvm-mingw's own
      # clang-tidy is used, because it finds llvm-mingw's MinGW headers, and tools/CheckToolchain.cs
      # checks first that it is of the LLVM release that the llvm pin names
      # (runtime-macos-harness.md section 8).
      - name: Analyze the Win32 test programs (llvm-mingw's clang-tidy)
        if: ${{ !cancelled() && steps.win32.outcome == 'success' }}
        run: |
          PATH="$LLVM_MINGW/bin:$PATH" dotnet run tools/CheckToolchain.cs -- --llvm
          PATH="$LLVM_MINGW/bin:$PATH" eng/mac/check-native-style.sh tidy build/win32/x86_64

      - name: Build the harness (CMake preset macos-harness)
        id: harness
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        working-directory: src/native
        run: |
          cmake --preset macos-harness
          cmake --build --preset macos-harness --parallel

      # S4.2.5: every case passes. The runner makes a template prefix with wineboot, runs each
      # case in a fresh harness process with a fresh copy of it, and writes a summary.
      - name: Run the harness's cases (eng/mac/run-harness.sh --mode multi)
        id: cases
        if: ${{ !cancelled() && (steps.wine-cache.outputs.cache-hit == 'true' || steps.wine.outcome == 'success') && (steps.fex-cache.outputs.cache-hit == 'true' || steps.fex.outcome == 'success') && steps.win32.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: eng/mac/run-harness.sh --mode multi --no-build

      # Each run of the runner replaces its logs, so the cases' logs are kept before the next.
      - name: Keep the logs of the cases
        if: ${{ always() && steps.cases.outcome != 'skipped' }}
        run: |
          if [ -d build/runtime/logs ]; then
            mkdir -p build/runtime-logs
            cp -R build/runtime/logs build/runtime-logs/cases
          fi

      # S4.2.5: each planted case has one wrong expectation, so the run must fail and name both.
      # The job's summary keeps the table of the real cases only.
      - name: Run the planted cases, which must fail and be named
        id: planted
        if: ${{ !cancelled() && steps.cases.outcome != 'skipped' }}
        run: |
          status=0
          output=$(GITHUB_STEP_SUMMARY= eng/mac/run-harness.sh --planted --no-build 2>&1) || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error title=Planted cases::The planted cases passed."
            exit 1
          fi
          # Whole lines, so that a planted case that also crashed or drew a report from Wine,
          # which the harness adds after "; ", does not pass.
          if ! grep -qxF "FAIL wrong_line: line 1 differs: expected = console: hello from an i686 build, printed console: hello from an x86-64 build" <<< "$output"; then
            echo "::error title=Planted cases::The run did not name wrong_line and its wrong line."
            exit 1
          fi
          if ! grep -qxF "FAIL wrong_exit_code: exited with 3, not 4" <<< "$output"; then
            echo "::error title=Planted cases::The run did not name wrong_exit_code and its exit code."
            exit 1
          fi
          echo "The planted cases failed with their names, as expected."

      - name: Keep the logs of the planted cases
        if: ${{ always() && steps.planted.outcome != 'skipped' }}
        run: |
          if [ -d build/runtime/logs ]; then
            mkdir -p build/runtime-logs
            cp -R build/runtime/logs build/runtime-logs/planted
          fi

      # The cases' logs, and the logs of a fork build that ran in this job.
      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-logs-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            build/runtime-logs/
            build/wine/build/*.log
            build/fex/*.log
          if-no-files-found: ignore
          retention-days: 14

  # The native host (C-0011 section 4): its format and analysis checks, its CTest suite with
  # both sanitizer presets, and the binding tests of Paneport.Interop against the host's test
  # library. Like dotnet and checks, it runs on every push and every pull request.
  native:
    # eng/toolchain.json pins this image as macos-runner-image, and tools/CheckToolchain.cs
    # fails when the two differ.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # The image has System Integrity Protection disabled. With this setting,
      # test_thread_control.destroyed_request_fails_as_ended, which reports itself skipped where
      # SIP is enabled, fails instead, so that an image that enables it is noticed
      # (docs/design/signals.md section 10).
      PANEPORT_EXPECT_SIP_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Select the Xcode that eng/toolchain.json pins (eng/mac/select-xcode.sh)
        run: eng/mac/select-xcode.sh

      # It checks the SDK and Xcode against their pins, installs CMake and the LLVM release of
      # clang-format and clang-tidy from their pinned downloads, checks them, and puts them
      # first on the PATH of the later steps.
      - name: Check the toolchain and install CMake and LLVM (eng/mac/bootstrap.sh --native)
        run: eng/mac/bootstrap.sh --native

      - name: Show the Xcode, CMake, clang-format and clang-tidy versions
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -version
          cmake --version | head -n 1
          clang-format --version
          clang-tidy --version

      - name: Check the format of the native code (clang-format)
        if: ${{ !cancelled() }}
        run: eng/mac/check-native-style.sh format

      # S1.2.9: a format error in an uncommitted scratch copy fails the check. The copy lives in
      # build/, which git ignores, so clang-format finds the root .clang-format above it.
      - name: Check that a format error fails the check (planted)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/planted
          sed 's/^static bool fits(/static  bool   fits(/' src/native/host/memory_budget.c > build/planted/memory_budget.c
          if cmp -s src/native/host/memory_budget.c build/planted/memory_budget.c; then
            echo "::error title=Planted format error::The planted change did not apply."
            exit 1
          fi
          if eng/mac/check-native-style.sh format build/planted/memory_budget.c; then
            echo "::error title=Planted format error::The format check passed a misformatted file."
            exit 1
          fi
          echo "The format check failed on the planted error, as expected."

      - name: Build and test with AddressSanitizer and UndefinedBehaviorSanitizer (preset asan-ubsan)
        if: ${{ !cancelled() }}
        working-directory: src/native
        run: |
          cmake --preset asan-ubsan
          cmake --build --preset asan-ubsan --parallel
          ctest --preset asan-ubsan

      - name: Build and test with ThreadSanitizer (preset tsan)
        if: ${{ !cancelled() }}
        working-directory: src/native
        run: |
          cmake --preset tsan
          cmake --build --preset tsan --parallel
          ctest --preset tsan

      # clang-tidy reads the compile databases of a macOS test build and of both iOS builds, so
      # that it sees the code of both platforms, of the test builds and of the framework that the
      # main app ships. The iOS presets are only configured here; the ios job builds them.
      - name: Analyze the native code (clang-tidy)
        if: ${{ !cancelled() }}
        run: |
          (cd src/native && cmake --preset ios-device-test && cmake --preset ios-device)
          eng/mac/check-native-style.sh tidy \
            build/native/asan-ubsan build/native/ios-device-test build/native/ios-device

      - name: Build the host test library (preset macos-test)
        if: ${{ !cancelled() }}
        working-directory: src/native
        run: |
          cmake --preset macos-test
          cmake --build --preset macos-test --parallel

      - name: Restore tests/Paneport.Interop.Tests from its lock file
        if: ${{ !cancelled() }}
        run: dotnet restore tests/Paneport.Interop.Tests/Paneport.Interop.Tests.csproj --locked-mode

      # As in the dotnet job: locked mode writes a missing lock file instead of failing.
      - name: Check that no lock file was written
        if: ${{ !cancelled() }}
        run: |
          written=$(git status --porcelain --untracked-files=all -- '*.lock.json')
          if [ -n "$written" ]; then
            echo "$written"
            echo "::error title=Lock files::A lock file was created or changed. Commit each project's lock file (C-0009 section 2)."
            exit 1
          fi

      - name: Build tests/Paneport.Interop.Tests
        if: ${{ !cancelled() }}
        run: dotnet build tests/Paneport.Interop.Tests/Paneport.Interop.Tests.csproj -c Release --no-restore

      - name: Check the formatting of tests/Paneport.Interop.Tests
        if: ${{ !cancelled() }}
        run: dotnet format tests/Paneport.Interop.Tests/Paneport.Interop.Tests.csproj --verify-no-changes --no-restore

      # The tests load the host test library from PANEPORT_HOST_LIBRARY and fail without it,
      # and a skipped test counts as a failure.
      - name: Run tests/Paneport.Interop.Tests against the host test library
        if: ${{ !cancelled() }}
        env:
          PANEPORT_HOST_LIBRARY: ${{ github.workspace }}/build/native/macos-test/libpaneport_host.dylib
        run: dotnet test tests/Paneport.Interop.Tests/Paneport.Interop.Tests.csproj -c Release --no-build --fail-skips on

  # D7 (plan section 4.2), recelilious's decision: the ios job runs for every pull request, on
  # the merge result that the pull_request event checks out, and for every push to main, which
  # catches two pull requests that pass alone and break together, and direct commits. Other
  # branch pushes skip it, because the pull request's run covers them. Only a pull request
  # cancels its own earlier run. Every push to main is built: each gets a group of its own
  # commit, because a group keeps one pending run and a newer run would cancel it.
  ios:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # eng/toolchain.json pins this image as macos-runner-image, and tools/CheckToolchain.cs
    # fails when the two differ.
    runs-on: xcode-27
    timeout-minutes: 45
    concurrency:
      group: ios-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # The switch of C-0009 section 4 for extended-virtual-addressing, off as L1 and the release
    # expect: the build takes it as PaneportExtendedVirtualAddressing, eng/mac/sign-adhoc.sh
    # declares the entitlement only when it is true, and eng/mac/check-app.sh then expects it.
    env:
      PANEPORT_EXTENDED_VIRTUAL_ADDRESSING: "false"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The image's default Xcode can move past the pin while the pinned one is still
      # installed, so every later step uses the pinned one, through DEVELOPER_DIR. The script
      # rejects a version-named folder that resolves to a release candidate or a beta.
      - name: Select the Xcode that eng/toolchain.json pins (eng/mac/select-xcode.sh)
        run: eng/mac/select-xcode.sh

      # It checks the SDK and Xcode against their pins, installs the iOS workload from the
      # pinned workload set, and CMake and the build tools of the forks from their pinned
      # downloads, and checks them too. llvm-mingw stays off the PATH, in LLVM_MINGW.
      - name: Check the toolchain and install the iOS workload, CMake and the fork tools (eng/mac/bootstrap.sh --ios --forks)
        run: eng/mac/bootstrap.sh --ios --forks

      # A second run must find the workload in place and skip the install, as it must after the
      # owner of an SDK folder that this user cannot write has installed the workload, and must
      # install no tool again.
      - name: Check that the bootstrap skips what is installed
        if: ${{ !cancelled() }}
        run: |
          output=$(eng/mac/bootstrap.sh --ios --forks 2>&1)
          echo "$output"
          if ! grep -E -q "the ios workload from workload set [^ ]+ is already installed" <<< "$output"; then
            echo "::error title=Bootstrap::A second run of the bootstrap did not find the installed workload."
            exit 1
          fi
          if grep -E -q "^bootstrap: (installing|building) " <<< "$output"; then
            echo "::error title=Bootstrap::A second run of the bootstrap installed something again."
            exit 1
          fi

      - name: Show the SDK, workload set, Xcode and CMake versions
        if: ${{ !cancelled() }}
        run: |
          echo "SDK: $(dotnet --version)"
          echo "Workload set: $(dotnet workload --version)"
          dotnet workload list
          xcodebuild -version
          echo "Xcode in use: ${DEVELOPER_DIR:-$(xcode-select -p)}"
          cmake --version | head -n 1

      # The bootstrap must refuse any Xcode but the pinned one. The step runs it against
      # another Xcode on the image and passes only if it fails and names both versions. It
      # hides the tool's annotations, because this failure is the expected one.
      - name: Check that the bootstrap refuses another Xcode (planted mismatch)
        if: ${{ !cancelled() }}
        run: |
          pin=$(plutil -extract tools.xcode.version raw -o - eng/toolchain.json)
          other=""
          for app in /Applications/Xcode*.app; do
            version=$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist" 2>/dev/null || true)
            if [ -n "$version" ] && [ "$version" != "$pin" ]; then
              other=$app
              found=$version
              break
            fi
          done
          if [ -z "$other" ]; then
            echo "::error title=Planted mismatch::The image has no Xcode other than $pin to plant."
            exit 1
          fi
          echo "Running the bootstrap against $other (Xcode $found; the pin is $pin)."
          status=0
          output=$(DEVELOPER_DIR="$other/Contents/Developer" GITHUB_ACTIONS=false eng/mac/bootstrap.sh --ios 2>&1) || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error title=Planted mismatch::The bootstrap passed with Xcode $found, but the pin is $pin."
            exit 1
          fi
          if ! grep -F -q "xcode $found is installed, but eng/toolchain.json pins $pin." <<< "$output"; then
            echo "::error title=Planted mismatch::The bootstrap failed without naming Xcode $found and the pin $pin."
            exit 1
          fi
          echo "The bootstrap exited with $status and named both versions, as expected."

      # --fork-tools must name a build tool that is missing or at another version. The step runs
      # the check with /usr/bin first on the PATH, which holds the Python that Xcode carries, and
      # without llvm-mingw's folder, and passes only if the check fails and names both. It hides
      # the tool's annotations, because this failure is the expected one.
      - name: Check that --fork-tools names a missing and another build tool (planted mismatch)
        if: ${{ !cancelled() }}
        run: |
          pin=$(plutil -extract tools.python.version raw -o - eng/toolchain.json)
          status=0
          output=$(PATH="/usr/bin:$PATH" GITHUB_ACTIONS=false dotnet run tools/CheckToolchain.cs -- --fork-tools 2>&1) || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error title=Planted mismatch::--fork-tools passed without llvm-mingw and with Xcode's Python first on the PATH."
            exit 1
          fi
          if ! grep -F -q "llvm-mingw is not installed, or not on the PATH." <<< "$output"; then
            echo "::error title=Planted mismatch::--fork-tools did not name the missing llvm-mingw."
            exit 1
          fi
          if ! grep -E -q "python [0-9][^ ]* is installed, but eng/toolchain.json pins ${pin//./[.]}[.]" <<< "$output"; then
            echo "::error title=Planted mismatch::--fork-tools did not name Xcode's Python and the pin $pin."
            exit 1
          fi
          echo "--fork-tools exited with $status and named both, as expected."

      # S1.2.10: paneport_host.framework from both iOS presets, the one that the main app embeds
      # and the one with the test exports that the device test flavor embeds (M1.3).
      - name: Build the host frameworks (presets ios-device and ios-device-test)
        if: ${{ !cancelled() }}
        working-directory: src/native
        run: |
          for preset in ios-device ios-device-test; do
            cmake --preset "$preset"
            cmake --build --preset "$preset" --parallel
          done

      - name: Check the host frameworks (eng/mac/check-framework.sh)
        if: ${{ !cancelled() }}
        run: |
          eng/mac/check-framework.sh build/native/ios-device/paneport_host.framework \
            build/native/ios-device-test/paneport_host.framework

      # The forks' first targets (docs/design/forks.md section 7), which use the build tools that
      # the bootstrap installed. Only this job fetches the forks: each at the commit this
      # repository records, at depth 1, and of their own submodules only those these targets
      # need. Every step prints the versions it uses.
      - name: Fetch the forks, and the submodules of theirs that the first targets need
        if: ${{ !cancelled() }}
        run: |
          git submodule update --init --depth 1 external/Paneport-wine external/Paneport-FEX external/Paneport-dxmt
          git -C external/Paneport-FEX submodule update --init --depth 1 External/fmt External/xxhash \
            External/range-v3 External/unordered_dense External/rpmalloc Source/Common/cpp-optparse
          git -C external/Paneport-dxmt submodule update --init --depth 1 include/native/directx
          git submodule status

      - name: Configure Wine for the macOS host with its PE architectures, and build its tools
        if: ${{ !cancelled() }}
        run: |
          export PATH="$LLVM_MINGW/bin:$PATH"
          x86_64-w64-mingw32-clang --version | head -n 1
          bison --version | head -n 1
          flex --version
          mkdir -p "$RUNNER_TEMP/wine"
          cd "$RUNNER_TEMP/wine"
          if ! "$GITHUB_WORKSPACE/external/Paneport-wine/configure" --enable-archs=arm64ec,aarch64,i386 \
              --with-mingw=clang --without-freetype --disable-tests > configure.out 2>&1; then
            tail -n 60 configure.out
            tail -n 120 config.log
            exit 1
          fi
          tail -n 30 configure.out
          if ! make -j"$(sysctl -n hw.ncpu)" __tooldeps__ > tools.out 2>&1; then
            tail -n 80 tools.out
            exit 1
          fi
          tools/winebuild/winebuild --version

      - name: Build the i386 libraries of Wine that DXMT's build looks for
        if: ${{ !cancelled() }}
        run: |
          export PATH="$LLVM_MINGW/bin:$PATH"
          make -C "$RUNNER_TEMP/wine" -j"$(sysctl -n hw.ncpu)" libs/winecrt0/i386-windows/libwinecrt0.a \
            dlls/ntdll/i386-windows/libntdll.a dlls/dbghelp/i386-windows/libdbghelp.a

      - name: Configure FEX for arm64ec-w64-mingw32
        if: ${{ !cancelled() }}
        run: |
          export PATH="$LLVM_MINGW/bin:$PATH"
          cmake --version | head -n 1
          echo "ninja $(ninja --version)"
          python3 --version
          cmake -S external/Paneport-FEX -B "$RUNNER_TEMP/fex-arm64ec" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/external/Paneport-FEX/Data/CMake/toolchain_mingw.cmake" \
            -DMINGW_TRIPLE=arm64ec-w64-mingw32 -DCMAKE_BUILD_TYPE=Release -DENABLE_LTO=False \
            -DBUILD_TESTING=False -DENABLE_JEMALLOC_GLIBC_ALLOC=False -DTUNE_CPU=none -DTUNE_ARCH=generic \
            -DPython_EXECUTABLE="$(command -v python3)"

      # The ARM64EC side also builds DXMT's shader converter for the Mac, which needs LLVM 15;
      # M5.2 pins it and sets that side up (docs/design/forks.md section 7).
      - name: Set up DXMT's 32-bit PE side against that Wine build (Meson)
        if: ${{ !cancelled() }}
        run: |
          export PATH="$LLVM_MINGW/bin:$PATH"
          echo "meson $(meson --version)"
          meson setup --cross-file external/Paneport-dxmt/build-win32.txt \
            -Dwine_build_path="$RUNNER_TEMP/wine" "$RUNNER_TEMP/dxmt-i386" external/Paneport-dxmt

      # Both flavors of the app (M1.3): the main app in src/Paneport.iOS, and the device test flavor
      # in tests/device, which builds the same head with the developer menu and the host's test
      # build (docs/design/ios-app-head.md section 10).
      - name: Restore Paneport.iOS and the device test flavor from their lock files
        if: ${{ !cancelled() }}
        run: |
          dotnet restore src/Paneport.iOS/Paneport.iOS.csproj --locked-mode
          dotnet restore tests/device/Paneport.DeviceTest.csproj --locked-mode

      # As in the dotnet job: locked mode writes a missing lock file instead of failing. The
      # step prints a written lock file, which is how the lock files of the iOS projects are made
      # without a Mac (docs/design/dev-environment.md section 5). NuGet ends the file without a
      # line break, so the step adds one, which keeps the printed file whole and the error
      # command on a line of its own.
      - name: Check that no lock file was written
        if: ${{ !cancelled() }}
        run: |
          written=$(git status --porcelain --untracked-files=all -- '*.lock.json')
          if [ -n "$written" ]; then
            echo "$written"
            for file in $(git status --porcelain --untracked-files=all -- '*.lock.json' | cut -c4-); do
              echo "----- $file"
              cat "$file"
              echo
            done
            echo "::error title=Lock files::A lock file was created or changed. Commit each project's lock file (C-0009 section 2)."
            exit 1
          fi

      # Release with full ahead-of-time compilation and the interpreter off (C-0009 section 3),
      # without signing. The build stamp gets the pull request's head commit, because the job
      # checks out the merge commit, and the run number as the build number; a push names its
      # own commit.
      - name: Build both flavors for ios-arm64 in Release, without signing
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          status=0
          for project in src/Paneport.iOS/Paneport.iOS.csproj tests/device/Paneport.DeviceTest.csproj; do
            dotnet build "$project" -c Release --no-restore \
              -p:PaneportCommit="$HEAD_SHA" -p:PaneportBuildNumber="$RUN_NUMBER" \
              -p:PaneportExtendedVirtualAddressing="$PANEPORT_EXTENDED_VIRTUAL_ADDRESSING" || status=1
          done
          exit "$status"

      - name: Check the formatting of both flavors
        if: ${{ !cancelled() }}
        run: |
          status=0
          for project in src/Paneport.iOS/Paneport.iOS.csproj tests/device/Paneport.DeviceTest.csproj; do
            dotnet format "$project" --verify-no-changes --no-restore || status=1
          done
          exit "$status"

      # The bundle of each flavor, for the steps below, and the short commit hash that names its .ipa.
      - name: Find both apps
        id: apps
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          status=0
          echo "commit=${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"
          main=$(find src/Paneport.iOS/bin/Release -maxdepth 4 -type d -name 'Paneport.iOS.app' | head -n 1)
          test=$(find tests/device/bin/Release -maxdepth 4 -type d -name 'Paneport.DeviceTest.app' | head -n 1)
          if [ -n "$main" ]; then
            echo "main=$main" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=App bundle::The main app's build made no .app bundle."
            status=1
          fi
          if [ -n "$test" ]; then
            echo "test=$test" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=App bundle::The device test flavor's build made no .app bundle."
            status=1
          fi
          exit "$status"

      - name: Self-test the notices generator (tools/GenerateNotices.cs)
        if: ${{ !cancelled() }}
        run: dotnet run tools/GenerateNotices.cs -- --self-test

      # M9.1: the checks of the package scan that need macOS, such as a real ad-hoc signature made
      # with codesign, run here and are skipped in the checks job; and the tools of the release
      # workflow, which runs on this runner image, check themselves on it.
      - name: Self-test the package scan, the version rules and the source archiver on macOS
        if: ${{ !cancelled() }}
        run: |
          status=0
          dotnet run tools/ScanPackage.cs -- --self-test || status=1
          dotnet run tools/ReleaseVersion.cs -- --self-test || status=1
          dotnet run tools/ArchiveSources.cs -- --self-test || status=1
          exit "$status"

      # S9.1.1: the texts that no package ships, which eng/release/bundle-components.json names by
      # a raw.githubusercontent.com URL at a full commit and a SHA-256. The generator, which never
      # uses the network, prints the list from the mapping; the step fetches each text over https
      # only, with a size limit, into build/upstream/<sha256>, and fails on a hash that differs,
      # naming the URL and both hashes. The generator checks each hash again when it reads the file.
      - name: Fetch the license texts that no package ships
        if: ${{ !cancelled() && (steps.apps.outputs.main != '' || steps.apps.outputs.test != '') }}
        run: |
          list=$(dotnet run tools/GenerateNotices.cs -- --list-upstream)
          mkdir -p build/upstream
          status=0
          while read -r hash url; do
            [ -n "$hash" ] || continue
            file="build/upstream/$hash"
            if ! curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 --max-filesize 1048576 \
                -o "$file.part" "$url"; then
              echo "::error title=Upstream texts::$url could not be fetched."
              rm -f "$file.part"
              status=1
              continue
            fi
            actual=$(shasum -a 256 "$file.part" | cut -d ' ' -f 1)
            if [ "$actual" != "$hash" ]; then
              echo "::error title=Upstream texts::$url has the SHA-256 $actual, but eng/release/bundle-components.json gives $hash."
              rm -f "$file.part"
              status=1
              continue
            fi
            mv "$file.part" "$file"
            echo "Fetched $url ($hash)."
          done <<< "$list"
          exit "$status"

      # S9.1.1: THIRD_PARTY_NOTICES.md, the license texts and their index in licenses/ at the root
      # of each bundle, before it is signed, so that the signature seals them (C-0003 section 3,
      # C-0009 section 6), and a copy in build/notices/, never in git. The generator attributes
      # every file of the bundle through eng/release/bundle-components.json; here a file that it
      # does not attribute and a text that the mapping lists as having no source yet are warnings,
      # and a component that the register lacks or marks Under review or Forbidden, a missing license
      # text, missing full terms of LGPL-2.1, Apache-2.0 or Unicode-3.0, an upstream text that is
      # missing or changed, and an LGPL component other than SteamKit2 in the main executable fail
      # (docs/design/release-engineering.md).
      - name: Place the third-party notices in both apps (tools/GenerateNotices.cs)
        if: ${{ !cancelled() && (steps.apps.outputs.main != '' || steps.apps.outputs.test != '') }}
        env:
          MAIN_APP: ${{ steps.apps.outputs.main }}
          TEST_APP: ${{ steps.apps.outputs.test }}
        run: |
          status=0
          if [ -n "$MAIN_APP" ]; then
            dotnet run tools/GenerateNotices.cs -- --mode ios --project src/Paneport.iOS/Paneport.iOS.csproj \
              --app "$MAIN_APP" --out build/notices/main || status=1
          fi
          if [ -n "$TEST_APP" ]; then
            dotnet run tools/GenerateNotices.cs -- --mode ios --project tests/device/Paneport.DeviceTest.csproj \
              --app "$TEST_APP" --out build/notices/test || status=1
          fi
          exit "$status"

      # M9.1: release device builds are stripped of symbols (C-0009 section 6). dotnet build in Release
      # strips them already; this step makes sure of it before signing, whatever the SDK or a package
      # does, and the full scan below fails on any debugging entry but strip's own marker.
      - name: Strip both apps (eng/release/strip-binaries.sh)
        if: ${{ !cancelled() && (steps.apps.outputs.main != '' || steps.apps.outputs.test != '') }}
        env:
          MAIN_APP: ${{ steps.apps.outputs.main }}
          TEST_APP: ${{ steps.apps.outputs.test }}
        run: |
          status=0
          if [ -n "$MAIN_APP" ]; then
            eng/release/strip-binaries.sh "$MAIN_APP" || status=1
          fi
          if [ -n "$TEST_APP" ]; then
            eng/release/strip-binaries.sh "$TEST_APP" || status=1
          fi
          exit "$status"

      # S1.3.9: each embedded framework, then each app, ad hoc, with the app's Entitlements.plist;
      # no Apple identity is used (C-0009 section 5). Then the checks of eng/mac/check-app.sh, the
      # .ipa of each flavor, named by flavor and short commit hash, and the package scan. Each
      # step goes on with the other flavor after a failure, and a flavor whose bundle exists is
      # checked even when its signing failed, so that one run shows every failure.
      - name: Sign both flavors ad hoc (eng/mac/sign-adhoc.sh)
        if: ${{ !cancelled() && (steps.apps.outputs.main != '' || steps.apps.outputs.test != '') }}
        env:
          MAIN_APP: ${{ steps.apps.outputs.main }}
          TEST_APP: ${{ steps.apps.outputs.test }}
        run: |
          status=0
          if [ -n "$MAIN_APP" ]; then
            eng/mac/sign-adhoc.sh "$MAIN_APP" src/Paneport.iOS/Entitlements.plist || status=1
          fi
          if [ -n "$TEST_APP" ]; then
            eng/mac/sign-adhoc.sh "$TEST_APP" src/Paneport.iOS/Entitlements.plist || status=1
          fi
          exit "$status"

      - name: Check both apps (eng/mac/check-app.sh)
        if: ${{ !cancelled() && (steps.apps.outputs.main != '' || steps.apps.outputs.test != '') }}
        env:
          MAIN_APP: ${{ steps.apps.outputs.main }}
          TEST_APP: ${{ steps.apps.outputs.test }}
        run: |
          status=0
          if [ -n "$MAIN_APP" ]; then
            eng/mac/check-app.sh "$MAIN_APP" main || status=1
          fi
          if [ -n "$TEST_APP" ]; then
            eng/mac/check-app.sh "$TEST_APP" test || status=1
          fi
          exit "$status"

      - name: Package both apps as .ipa files (eng/mac/package-ipa.sh)
        id: packages
        if: ${{ !cancelled() && (steps.apps.outputs.main != '' || steps.apps.outputs.test != '') }}
        env:
          MAIN_APP: ${{ steps.apps.outputs.main }}
          TEST_APP: ${{ steps.apps.outputs.test }}
          COMMIT: ${{ steps.apps.outputs.commit }}
        run: |
          status=0
          if [ -n "$MAIN_APP" ]; then
            main_ipa="$RUNNER_TEMP/Paneport-main-$COMMIT.ipa"
            if eng/mac/package-ipa.sh "$MAIN_APP" "$main_ipa"; then
              echo "main=$main_ipa" >> "$GITHUB_OUTPUT"
            else
              status=1
            fi
          fi
          if [ -n "$TEST_APP" ]; then
            test_ipa="$RUNNER_TEMP/Paneport-test-$COMMIT.ipa"
            if eng/mac/package-ipa.sh "$TEST_APP" "$test_ipa"; then
              echo "test=$test_ipa" >> "$GITHUB_OUTPUT"
            else
              status=1
            fi
          fi
          exit "$status"

      # M9.1, S9.1.3: the whole scan of C-0009 section 6 on both flavors, with the allow-list of the
      # release workflow, which names each allowed hit by file and by the SHA-256 of its text (C-0011
      # section 4). It also checks that every signature is ad hoc and not the linker's, that the
      # executable carries exactly the entitlements of Entitlements.plist, that nothing keeps debug
      # symbols, that nothing is of a kind that C-0009 section 4 excludes, and that no file holds
      # this job's checkout path. Both flavors are scanned together, so an allow-list entry that
      # excuses nothing in either fails.
      - name: Scan both packages (tools/ScanPackage.cs)
        if: ${{ !cancelled() && (steps.packages.outputs.main != '' || steps.packages.outputs.test != '') }}
        env:
          MAIN_IPA: ${{ steps.packages.outputs.main }}
          TEST_IPA: ${{ steps.packages.outputs.test }}
        run: |
          options=(--allow-list eng/release/scan-allowlist.json --strict-allow-list
            --entitlements src/Paneport.iOS/Entitlements.plist --build-path "$GITHUB_WORKSPACE")
          if [ "$PANEPORT_EXTENDED_VIRTUAL_ADDRESSING" = true ]; then
            options+=(--extended-virtual-addressing)
          fi
          packages=()
          if [ -n "$MAIN_IPA" ]; then
            packages+=("$MAIN_IPA")
          fi
          if [ -n "$TEST_IPA" ]; then
            packages+=("$TEST_IPA")
          fi
          dotnet run tools/ScanPackage.cs -- "${options[@]}" "${packages[@]}"

      # S9.1.1: each .ipa holds the notices of its app: THIRD_PARTY_NOTICES.md, the index and every
      # text that the index names, in licenses/ at the root of the app.
      - name: Check that both packages hold the notices
        if: ${{ !cancelled() && (steps.packages.outputs.main != '' || steps.packages.outputs.test != '') }}
        env:
          MAIN_IPA: ${{ steps.packages.outputs.main }}
          TEST_IPA: ${{ steps.packages.outputs.test }}
        run: |
          status=0
          for ipa in "$MAIN_IPA" "$TEST_IPA"; do
            [ -n "$ipa" ] || continue
            package=$(basename "$ipa")
            entries=$(zipinfo -1 "$ipa") || { echo "::error title=Notices::$package cannot be read."; status=1; continue; }
            app=$(grep -E -m 1 '^Payload/[^/]+\.app/Info\.plist$' <<< "$entries" | sed 's|/Info\.plist$||' || true)
            if [ -z "$app" ]; then
              echo "::error title=Notices::$package holds no app."
              status=1
              continue
            fi
            texts=$(unzip -p "$ipa" "$app/licenses/index.json" 2>/dev/null | jq -r '.components[].text' 2>/dev/null || true)
            missing=0
            for file in THIRD_PARTY_NOTICES.md index.json $texts; do
              if ! grep -F -x -q "$app/licenses/$file" <<< "$entries"; then
                echo "::error title=Notices::$package lacks ${app#Payload/}/licenses/$file."
                missing=1
              fi
            done
            if [ -z "$texts" ]; then
              echo "::error title=Notices::$package has no index of the notices that names a text."
              missing=1
            fi
            if [ "$missing" -eq 0 ]; then
              echo "$package holds ${app#Payload/}/licenses/ with THIRD_PARTY_NOTICES.md, index.json and $(wc -w <<< "$texts" | tr -d ' ') texts."
            else
              status=1
            fi
          done
          exit "$status"

      # Only when every earlier step passed. The .ipa keeps the bundle's name and the
      # executable's file mode, which an artifact of the bare folder would lose.
      - name: Upload the main app
        if: ${{ success() && steps.packages.outputs.main != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paneport-main-${{ steps.apps.outputs.commit }}
          path: ${{ steps.packages.outputs.main }}
          if-no-files-found: error

      - name: Upload the device test flavor
        if: ${{ success() && steps.packages.outputs.test != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paneport-test-${{ steps.apps.outputs.commit }}
          path: ${{ steps.packages.outputs.test }}
          if-no-files-found: error
