# The jobs of C-0011 section 4 that exist so far. README.md in this folder lists them, and
# docs/design/repository-checks.md describes every check.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # No build or test run sends telemetry: the .NET CLI, Microsoft.Testing.Platform and
  # Avalonia's build statistics each read one of these.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

# In every job, each step after the setup runs even when an earlier one failed, so that one
# run shows every failure.
jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Check the SDK against global.json
        run: dotnet run tools/CheckToolchain.cs

      - name: Restore from the lock files
        if: ${{ !cancelled() }}
        run: dotnet restore eng/ci.slnf --locked-mode

      # Locked mode writes a missing lock file instead of failing, so a lock file that the
      # restore or a tool's run created or changed fails here: every project commits its own.
      - name: Check that no lock file was written
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          written=$(git status --porcelain --untracked-files=all -- '*.lock.json')
          if [ -n "$written" ]; then
            echo "$written"
            echo "::error title=Lock files::A lock file was created or changed. Commit each project's lock file (C-0009 section 2)."
            exit 1
          fi

      - name: Build
        if: ${{ !cancelled() }}
        run: dotnet build eng/ci.slnf -c Release --no-restore

      - name: Test
        if: ${{ !cancelled() }}
        run: dotnet test eng/ci.slnf -c Release --no-build --fail-skips on

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: dotnet format eng/ci.slnf --verify-no-changes --no-restore

      - name: Check the formatting of the tools
        if: ${{ !cancelled() }}
        run: dotnet format whitespace tools --folder --verify-no-changes

      - name: Publish the trimmed test app, with every trimming warning shown
        if: ${{ !cancelled() }}
        run: dotnet publish tests/Paneport.TrimTest/Paneport.TrimTest.csproj -c Release --no-build

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out, with the whole history for gitleaks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # REUSE comes from PyPI. gitleaks and lychee come from their GitHub releases, and each
      # download must match the SHA-256 that eng/toolchain.json pins before it is unpacked.
      - name: Install the CI tools that eng/toolchain.json pins
        shell: bash
        run: |
          pipx install "reuse==$(jq -r '.tools.reuse.version' eng/toolchain.json)"
          mkdir -p "$RUNNER_TEMP/bin"
          for tool in $(jq -r '.tools | to_entries[] | select(.value.downloads["linux-x64"]) | .key' eng/toolchain.json); do
            url=$(jq -r --arg tool "$tool" '.tools[$tool].downloads["linux-x64"].url' eng/toolchain.json)
            sha256=$(jq -r --arg tool "$tool" '.tools[$tool].downloads["linux-x64"].sha256' eng/toolchain.json)
            archive="$RUNNER_TEMP/$tool.tar.gz"
            curl --fail --silent --show-error --location --retry 3 --output "$archive" "$url"
            echo "$sha256  $archive" | sha256sum --check --strict
            mkdir -p "$RUNNER_TEMP/$tool"
            tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/$tool"
            binary=$(find "$RUNNER_TEMP/$tool" -type f -name "$tool" | head -n 1)
            install -m 755 "$binary" "$RUNNER_TEMP/bin/$tool"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Self-test the toolchain check
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckToolchain.cs -- --self-test

      - name: Check the SDK and the CI tools against their pins
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckToolchain.cs -- --ci-tools

      - name: Self-test the personal-data and forbidden-file check
        if: ${{ !cancelled() }}
        run: dotnet run tools/ScanPersonalData.cs -- --self-test

      - name: Self-test the dependency license check
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckLicenses.cs -- --self-test

      - name: Check license headers and texts (REUSE)
        if: ${{ !cancelled() }}
        run: reuse lint

      # The findings are redacted, and only their file, line, rule and commit are printed:
      # gitleaks' own verbose output would also print each commit's author and e-mail address.
      # gitleaks skips the findings that a .gitleaksignore in the scanned folder lists, whatever
      # its options, so such a file fails the step: every exception lives in eng/gitleaks.toml.
      - name: Scan the whole history for secrets (gitleaks)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -e .gitleaksignore ]; then
            echo "::error file=.gitleaksignore,title=gitleaks::gitleaks would skip the findings this file lists. Exceptions belong in eng/gitleaks.toml."
            exit 1
          fi
          report="$RUNNER_TEMP/gitleaks.json"
          status=0
          gitleaks git --config eng/gitleaks.toml --redact --ignore-gitleaks-allow --no-banner \
            --report-format json --report-path "$report" . || status=$?
          if [ -f "$report" ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=gitleaks::\(.RuleID), commit \(.Commit[0:12])",
              "\(.File):\(.StartLine): \(.RuleID): \(.Description) (commit \(.Commit[0:12]))"' "$report"
          fi
          exit "$status"

      - name: Check for personal data and forbidden files
        if: ${{ !cancelled() }}
        run: dotnet run tools/ScanPersonalData.cs

      - name: Check links in Markdown, outside the research notes (lychee)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: lychee --config eng/lychee.toml --no-progress .

      # The research notes' external sources are not checked (eng/lychee.toml says why).
      - name: Check the relative links of the research notes (lychee, offline)
        if: ${{ !cancelled() }}
        run: lychee --offline --no-progress --extensions md docs/research

      - name: Check dependency licenses
        if: ${{ !cancelled() }}
        run: dotnet run tools/CheckLicenses.cs

  # The native host (C-0011 section 4): its format and analysis checks, its CTest suite with
  # both sanitizer presets, and the binding tests of Paneport.Interop against the host's test
  # library. Like dotnet and checks, it runs on every push and every pull request.
  native:
    # eng/toolchain.json pins this image as macos-runner-image, and tools/CheckToolchain.cs
    # fails when the two differ.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Select the Xcode that eng/toolchain.json pins (eng/mac/select-xcode.sh)
        run: eng/mac/select-xcode.sh

      # It checks the SDK and Xcode against their pins, installs CMake and the LLVM release of
      # clang-format and clang-tidy from their pinned downloads, checks them, and puts them
      # first on the PATH of the later steps.
      - name: Check the toolchain and install CMake and LLVM (eng/mac/bootstrap.sh --native)
        run: eng/mac/bootstrap.sh --native

      - name: Show the Xcode, CMake, clang-format and clang-tidy versions
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -version
          cmake --version | head -n 1
          clang-format --version
          clang-tidy --version

      - name: Check the format of the native code (clang-format)
        if: ${{ !cancelled() }}
        run: eng/mac/check-native-style.sh format

      # S1.2.9: a format error in an uncommitted scratch copy fails the check. The copy lives in
      # build/, which git ignores, so clang-format finds the root .clang-format above it.
      - name: Check that a format error fails the check (planted)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/planted
          sed 's/^static bool fits(/static  bool   fits(/' src/native/host/memory_budget.c > build/planted/memory_budget.c
          if cmp -s src/native/host/memory_budget.c build/planted/memory_budget.c; then
            echo "::error title=Planted format error::The planted change did not apply."
            exit 1
          fi
          if eng/mac/check-native-style.sh format build/planted/memory_budget.c; then
            echo "::error title=Planted format error::The format check passed a misformatted file."
            exit 1
          fi
          echo "The format check failed on the planted error, as expected."

      - name: Build and test with AddressSanitizer and UndefinedBehaviorSanitizer (preset asan-ubsan)
        if: ${{ !cancelled() }}
        working-directory: src/native
        run: |
          cmake --preset asan-ubsan
          cmake --build --preset asan-ubsan --parallel
          ctest --preset asan-ubsan

      - name: Build and test with ThreadSanitizer (preset tsan)
        if: ${{ !cancelled() }}
        working-directory: src/native
        run: |
          cmake --preset tsan
          cmake --build --preset tsan --parallel
          ctest --preset tsan

      # clang-tidy reads the compile databases of a macOS build and of an iOS build, so that it
      # sees the code of both platforms. The iOS preset is only configured here; the ios job
      # builds it.
      - name: Analyze the native code (clang-tidy)
        if: ${{ !cancelled() }}
        run: |
          (cd src/native && cmake --preset ios-device-test)
          eng/mac/check-native-style.sh tidy build/native/asan-ubsan build/native/ios-device-test

      - name: Build the host test library (preset macos-test)
        if: ${{ !cancelled() }}
        working-directory: src/native
        run: |
          cmake --preset macos-test
          cmake --build --preset macos-test --parallel

      - name: Restore tests/Paneport.Interop.Tests from its lock file
        if: ${{ !cancelled() }}
        run: dotnet restore tests/Paneport.Interop.Tests/Paneport.Interop.Tests.csproj --locked-mode

      # As in the dotnet job: locked mode writes a missing lock file instead of failing.
      - name: Check that no lock file was written
        if: ${{ !cancelled() }}
        run: |
          written=$(git status --porcelain --untracked-files=all -- '*.lock.json')
          if [ -n "$written" ]; then
            echo "$written"
            echo "::error title=Lock files::A lock file was created or changed. Commit each project's lock file (C-0009 section 2)."
            exit 1
          fi

      - name: Build tests/Paneport.Interop.Tests
        if: ${{ !cancelled() }}
        run: dotnet build tests/Paneport.Interop.Tests/Paneport.Interop.Tests.csproj -c Release --no-restore

      - name: Check the formatting of tests/Paneport.Interop.Tests
        if: ${{ !cancelled() }}
        run: dotnet format tests/Paneport.Interop.Tests/Paneport.Interop.Tests.csproj --verify-no-changes --no-restore

      # The tests load the host test library from PANEPORT_HOST_LIBRARY and fail without it,
      # and a skipped test counts as a failure.
      - name: Run tests/Paneport.Interop.Tests against the host test library
        if: ${{ !cancelled() }}
        env:
          PANEPORT_HOST_LIBRARY: ${{ github.workspace }}/build/native/macos-test/libpaneport_host.dylib
        run: dotnet test tests/Paneport.Interop.Tests/Paneport.Interop.Tests.csproj -c Release --no-build --fail-skips on

  # D7 (plan section 4.2), recelilious's decision: the ios job runs for every pull request, on
  # the merge result that the pull_request event checks out, and for every push to main, which
  # catches two pull requests that pass alone and break together, and direct commits. Other
  # branch pushes skip it, because the pull request's run covers them. Only a pull request
  # cancels its own earlier run; every push to main is built.
  ios:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # eng/toolchain.json pins this image as macos-runner-image, and tools/CheckToolchain.cs
    # fails when the two differ.
    runs-on: xcode-27
    timeout-minutes: 45
    concurrency:
      group: ios-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the SDK that global.json pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The image's default Xcode can move past the pin while the pinned one is still
      # installed, so every later step uses the pinned one, through DEVELOPER_DIR. The script
      # rejects a version-named folder that resolves to a release candidate or a beta.
      - name: Select the Xcode that eng/toolchain.json pins (eng/mac/select-xcode.sh)
        run: eng/mac/select-xcode.sh

      # It checks the SDK and Xcode against their pins, installs the iOS workload from the
      # pinned workload set and CMake from its pinned download, and checks them too.
      - name: Check the toolchain and install the iOS workload and CMake (eng/mac/bootstrap.sh --ios)
        run: eng/mac/bootstrap.sh --ios

      # A second run must find the workload in place and skip the install, as it must after the
      # owner of an SDK folder that this user cannot write has installed the workload.
      - name: Check that the bootstrap skips a workload that is installed
        if: ${{ !cancelled() }}
        run: |
          output=$(eng/mac/bootstrap.sh --ios 2>&1)
          echo "$output"
          if ! grep -E -q "the ios workload from workload set [^ ]+ is already installed" <<< "$output"; then
            echo "::error title=Bootstrap::A second run of the bootstrap did not find the installed workload."
            exit 1
          fi

      - name: Show the SDK, workload set, Xcode and CMake versions
        if: ${{ !cancelled() }}
        run: |
          echo "SDK: $(dotnet --version)"
          echo "Workload set: $(dotnet workload --version)"
          dotnet workload list
          xcodebuild -version
          echo "Xcode in use: ${DEVELOPER_DIR:-$(xcode-select -p)}"
          cmake --version | head -n 1

      # The bootstrap must refuse any Xcode but the pinned one. The step runs it against
      # another Xcode on the image and passes only if it fails and names both versions. It
      # hides the tool's annotations, because this failure is the expected one.
      - name: Check that the bootstrap refuses another Xcode (planted mismatch)
        if: ${{ !cancelled() }}
        run: |
          pin=$(plutil -extract tools.xcode.version raw -o - eng/toolchain.json)
          other=""
          for app in /Applications/Xcode*.app; do
            version=$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist" 2>/dev/null || true)
            if [ -n "$version" ] && [ "$version" != "$pin" ]; then
              other=$app
              found=$version
              break
            fi
          done
          if [ -z "$other" ]; then
            echo "::error title=Planted mismatch::The image has no Xcode other than $pin to plant."
            exit 1
          fi
          echo "Running the bootstrap against $other (Xcode $found; the pin is $pin)."
          status=0
          output=$(DEVELOPER_DIR="$other/Contents/Developer" GITHUB_ACTIONS=false eng/mac/bootstrap.sh --ios 2>&1) || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error title=Planted mismatch::The bootstrap passed with Xcode $found, but the pin is $pin."
            exit 1
          fi
          if ! grep -F -q "xcode $found is installed, but eng/toolchain.json pins $pin." <<< "$output"; then
            echo "::error title=Planted mismatch::The bootstrap failed without naming Xcode $found and the pin $pin."
            exit 1
          fi
          echo "The bootstrap exited with $status and named both versions, as expected."

      # S1.2.10: paneport_host.framework from both iOS presets, the one that the main app embeds
      # and the one with the test exports that the device test flavor embeds (M1.3).
      - name: Build the host frameworks (presets ios-device and ios-device-test)
        if: ${{ !cancelled() }}
        working-directory: src/native
        run: |
          for preset in ios-device ios-device-test; do
            cmake --preset "$preset"
            cmake --build --preset "$preset" --parallel
          done

      - name: Check the host frameworks (eng/mac/check-framework.sh)
        if: ${{ !cancelled() }}
        run: |
          eng/mac/check-framework.sh build/native/ios-device/paneport_host.framework \
            build/native/ios-device-test/paneport_host.framework

      - name: Restore Paneport.iOS from its lock file
        if: ${{ !cancelled() }}
        run: dotnet restore src/Paneport.iOS/Paneport.iOS.csproj --locked-mode

      # As in the dotnet job: locked mode writes a missing lock file instead of failing. The
      # step prints a written lock file, which is how the lock file of Paneport.iOS is made
      # without a Mac (docs/design/dev-environment.md section 5). NuGet ends the file without
      # a line break, so the step adds one, which keeps the printed file whole and the error
      # command on a line of its own.
      - name: Check that no lock file was written
        if: ${{ !cancelled() }}
        run: |
          written=$(git status --porcelain --untracked-files=all -- '*.lock.json')
          if [ -n "$written" ]; then
            echo "$written"
            for file in $(git status --porcelain --untracked-files=all -- '*.lock.json' | cut -c4-); do
              echo "----- $file"
              cat "$file"
              echo
            done
            echo "::error title=Lock files::A lock file was created or changed. Commit each project's lock file (C-0009 section 2)."
            exit 1
          fi

      - name: Build Paneport.iOS for ios-arm64 in Release, without signing
        if: ${{ !cancelled() }}
        run: dotnet build src/Paneport.iOS/Paneport.iOS.csproj -c Release --no-restore

      - name: Check the formatting of Paneport.iOS
        if: ${{ !cancelled() }}
        run: dotnet format src/Paneport.iOS/Paneport.iOS.csproj --verify-no-changes --no-restore

      # The app names the scene delegate of its own Info.plist, supports iOS 26.0 and later
      # (C-0001 section 2), holds arm64 code only, and carries no signature and no profile
      # (C-0009 section 5). Apple's linker may give arm64 code an ad-hoc signature of its own,
      # marked linker-signed, which holds no identity; that one is accepted. Only an app that
      # passes every check is zipped, and the upload also needs every earlier step to have
      # passed. A push has no pull request, so its own commit names the artifact.
      - name: Check the app bundle
        id: app
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          app=$(find src/Paneport.iOS/bin/Release -maxdepth 4 -type d -name '*.app' | head -n 1)
          if [ -z "$app" ]; then
            echo "::error title=App bundle::The build made no .app bundle."
            exit 1
          fi
          scene_key=UIApplicationSceneManifest.UISceneConfigurations.UIWindowSceneSessionRoleApplication.0.UISceneDelegateClassName
          expected_scene=$(plutil -extract "$scene_key" raw -o - src/Paneport.iOS/Info.plist)
          scene=$(plutil -extract "$scene_key" raw -o - "$app/Info.plist" || echo "(none)")
          minimum=$(plutil -extract MinimumOSVersion raw -o - "$app/Info.plist" || echo "(none)")
          executable=$(plutil -extract CFBundleExecutable raw -o - "$app/Info.plist")
          architectures=$(lipo -archs "$app/$executable")
          signature=$(codesign -dv "$app" 2>&1 || true)
          echo "App: $app"
          echo "Scene delegate: $scene"
          echo "Minimum iOS version: $minimum"
          lipo -info "$app/$executable"
          echo "codesign -dv: $signature"
          problems=0
          [ "$scene" = "$expected_scene" ] || { echo "::error title=App bundle::The scene delegate is $scene, not $expected_scene."; problems=1; }
          [ "$minimum" = 26.0 ] || { echo "::error title=App bundle::The minimum iOS version is $minimum, not 26.0."; problems=1; }
          [ "$architectures" = arm64 ] || { echo "::error title=App bundle::The executable holds $architectures, not arm64 alone."; problems=1; }
          if grep -F -q "is not signed at all" <<< "$signature"; then
            echo "Signature: none."
          elif grep -F -q "linker-signed" <<< "$signature" && grep -F -q "Signature=adhoc" <<< "$signature" \
              && grep -F -q "TeamIdentifier=not set" <<< "$signature"; then
            echo "Signature: only the linker's ad-hoc signature, with no identity."
          else
            echo "::error title=App bundle::The app carries a signature beyond the linker's own."
            problems=1
          fi
          [ ! -e "$app/embedded.mobileprovision" ] || { echo "::error title=App bundle::The app holds a provisioning profile."; problems=1; }
          [ "$problems" -eq 0 ] || exit 1
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/$(basename "$app").zip"
          echo "zip=$RUNNER_TEMP/$(basename "$app").zip" >> "$GITHUB_OUTPUT"
          echo "commit=${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"

      # The zip keeps the bundle's name and the executable's file mode, which an artifact of
      # the bare folder would lose.
      - name: Upload the app
        if: ${{ success() && steps.app.outputs.zip != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Paneport.iOS-ios-arm64-${{ steps.app.outputs.commit }}
          path: ${{ steps.app.outputs.zip }}
          if-no-files-found: error
